<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Handschrift-Arbeitsblätter</title>

<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6606842033313209"
  crossorigin="anonymous">
</script>

<style>
:root{--accent:#4f9d75;--accent-dark:#3b7f5c;--accent-soft:#e8f4ed;--bg:#f5f8f6;--card:#fff;--text:#22302a;--muted:#75847b;--line:#e3ebe6;--border:#cfe0d6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.tk-logo{display:flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;color:#fff;border-radius:11px;background:linear-gradient(145deg,#72c295,#3b7f5c);box-shadow:0 2px 6px rgba(59,127,92,.30),inset 0 1px 0 rgba(255,255,255,.35);font-family:Georgia,serif;font-size:19px;font-weight:bold;letter-spacing:-1px;user-select:none}
.tk-logo span{display:inline-block}
main{display:grid;grid-template-columns:380px 1fr;gap:24px;max-width:1400px;margin:auto;padding:28px}
.panel{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(30,60,45,.05),0 8px 24px rgba(30,60,45,.05)}
h2{margin:0 0 10px;color:var(--text);font-size:17px;font-weight:600}
.hint{color:var(--muted);font-size:13px;line-height:1.55}
.character-list{display:flex;flex-wrap:wrap;gap:5px;max-height:220px;margin:16px 0;padding:10px;overflow-y:auto;background:var(--bg);border-radius:10px}
.character-list button{width:34px;height:34px;padding:0;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:background .15s,border-color .15s}
.character-list button:hover{background:var(--accent-soft);border-color:var(--border)}
.character-list button.active{color:#fff;background:var(--accent-dark);border-color:var(--accent-dark)}
.character-list button.saved{border:2px solid var(--accent);font-weight:bold}
.selected-character{margin:8px;color:var(--accent-dark);font-size:38px;font-weight:600;text-align:center}
.drawing-frame{width:50%;min-width:155px;max-width:190px;margin:auto;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 2px 8px rgba(30,60,45,.06)}
.drawing-title{margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:center}
#drawingCanvas{display:block;width:100%;height:auto;aspect-ratio:2/1;background:linear-gradient(to bottom,transparent 81.5%,#b8c8bd 81.7%,transparent 81.9%),#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
.variant-controls{display:flex;justify-content:center;gap:6px;margin-top:12px}
.variant-controls button{padding:7px 12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:12px;transition:background .15s}
.variant-controls button:hover{background:var(--accent-soft)}
.variant-controls button.active{color:#fff;background:var(--accent-dark);border-color:var(--accent-dark)}
.variant-controls button.available{border-color:var(--accent);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{font:inherit}
.actions button{padding:10px 16px;color:#fff;background:var(--accent-dark);border:0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;transition:background .15s,transform .05s}
.actions button:hover{background:#31694c}
.actions button:active{transform:translateY(1px)}
.actions button.secondary{color:var(--text);background:var(--accent-soft)}
.actions button.secondary:hover{background:#d8ecde}
.actions button:disabled{opacity:.65;cursor:wait}
textarea{width:100%;height:170px;padding:14px;color:var(--text);background:#fcfefd;border:1px solid var(--border);border-radius:12px;font:inherit;line-height:1.55;resize:vertical;outline:none;transition:border-color .15s,box-shadow .15s}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,157,117,.15)}
.worksheet-area{margin-top:22px;text-align:center;padding:22px 12px 4px;background:var(--bg);border-radius:12px}
.worksheet-page{display:block;width:100%;max-width:794px;height:auto;margin:0 auto 24px;background:#fff;border-radius:2px;box-shadow:0 2px 6px rgba(30,60,45,.10),0 10px 28px rgba(30,60,45,.10)}
.page-label{margin:0 0 8px;color:var(--muted);font-size:12px}
@media (max-width:850px){
  main{grid-template-columns:1fr;padding:14px}
  header{padding:12px 16px}
  .panel{padding:18px}
}
</style>
</head>

<body>

<header>
  <div class="tk-logo" aria-label="TK Logo"><span>T</span><span>K</span></div>
  <h1>Meine Handschrift-Arbeitsblätter</h1>
</header>

<main>

<section class="panel">
  <h2>1. Buchstaben zeichnen</h2>
  <p class="hint">Jeder Buchstabe besitzt eine eigene Vorlage. Eine zweite Vorlage ist optional und sorgt für natürlichere Wiederholungen.</p>

  <div id="characterList" class="character-list"></div>
  <div id="selectedCharacter" class="selected-character">A</div>

  <div class="drawing-frame">
    <div id="drawingTitle" class="drawing-title">Erste Vorlage</div>
    <canvas id="drawingCanvas" width="600" height="300"></canvas>
  </div>

  <div class="variant-controls">
    <button id="firstVariantButton" class="active">Erste Vorlage</button>
    <button id="secondVariantButton">Zweite Vorlage</button>
  </div>

  <div class="actions">
    <button id="saveButton">Vorlage speichern</button>
    <button id="clearButton" class="secondary">Löschen</button>
  </div>

  <p id="status" class="hint"></p>
</section>

<section class="panel">
  <h2>2. Arbeitsblatt erstellen</h2>

  <textarea id="textInput">heute fährt max mit dem zug durch köln und kauft frisches brot beim bäcker. später schreibt er einen kurzen text über quizze und jazzmusik.</textarea>

  <div class="actions">
    <button id="generateButton">Arbeitsblatt erstellen</button>
    <button id="downloadButton" class="secondary">Als PNG herunterladen</button>
  </div>

  <p id="pageInfo" class="hint"></p>
  <p id="downloadInfo" class="hint"></p>

  <div class="worksheet-area" id="pages"></div>
</section>

</main>

<script>
const characters =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
  "abcdefghijklmnopqrstuvwxyz" +
  "ÄÖÜäöüß" +
  "ÁÉÍÓÚáéíóú" +
  "ÀÈÌÒÙàèìòù" +
  "ÂÊÎÔÛâêîôû" +
  "ÄËÏÖÜäëïöü" +
  "Ññ" +
  "0123456789" +
  ".,!?;:'\"()-_+/= ";

const SOURCE_BASELINE = 245;
const SOURCE_FONT_SIZE = 230;

const LETTER_GAP = 2.2;
const SPACE_WIDTH = 20;

const NARROW_LEFT_GAP = 0.9;
const NARROW_RIGHT_GAP = 0.5;
const NARROW_MIN_ADVANCE = 6;

/* Seitenlayout */
const PAGE_WIDTH = 794;
const PAGE_HEIGHT = 1123;
const MARGIN = 48;
const FIRST_BASELINE = 92;
const LINE_HEIGHT = 38;
const MAX_WIDTH = 27;
const TARGET_HEIGHT = 31;
const MAX_PAGES = 50;

const drawingCanvas = document.getElementById("drawingCanvas");
const drawingContext = drawingCanvas.getContext("2d");
const pagesElement = document.getElementById("pages");
const characterList = document.getElementById("characterList");
const selectedCharacterElement = document.getElementById("selectedCharacter");
const drawingTitle = document.getElementById("drawingTitle");
const statusText = document.getElementById("status");
const downloadInfo = document.getElementById("downloadInfo");
const pageInfo = document.getElementById("pageInfo");
const firstVariantButton = document.getElementById("firstVariantButton");
const secondVariantButton = document.getElementById("secondVariantButton");

/* Unsichtbarer Kontext nur zum Messen von Text */
const measureContext = document.createElement("canvas").getContext("2d");

let currentCharacter = "A";
let currentVariant = 0;
let strokes = [];
let currentStroke = null;

let handwriting = loadHandwriting();

/* Zustand beim Erstellen des Arbeitsblatts */
let pages = [];        // Liste aller Seiten-Canvas
let ctx = null;        // Kontext der aktuellen Seite
let cx = MARGIN;       // aktuelle x-Position
let cy = FIRST_BASELINE; // aktuelle Grundlinie
let needPage = false;  // true, wenn die nächste Zeichnung eine neue Seite braucht

function loadHandwriting() {
  let saved = {};

  try {
    saved = JSON.parse(localStorage.getItem("handwritingData") || "{}");
  } catch (error) {
    saved = {};
  }

  const converted = {};

  Object.keys(saved).forEach(character => {
    const value = saved[character];

    /* Alte Struktur: handwriting["A"] = [stroke, stroke, ...] */
    if (
      Array.isArray(value) &&
      (
        value.length === 0 ||
        Array.isArray(value[0]) &&
        (value[0].length === 0 || typeof value[0][0]?.x === "number")
      )
    ) {
      converted[character] = [value];
    }
    /* Neue Struktur: handwriting["A"] = [[stroke, ...], [stroke, ...]] */
    else if (Array.isArray(value)) {
      converted[character] = value;
    }
  });

  return converted;
}

function saveHandwriting() {
  localStorage.setItem("handwritingData", JSON.stringify(handwriting));
}

function cloneStrokes(value) {
  return JSON.parse(JSON.stringify(value));
}

function getVariants(character) {
  return handwriting[character] || [];
}

function createCharacterButtons() {
  characters.split("").forEach(character => {
    const button = document.createElement("button");

    button.textContent = character === " " ? "␠" : character;
    button.title = character === " " ? "Leerzeichen" : character;

    button.addEventListener("click", () => selectCharacter(character));
    characterList.appendChild(button);
  });

  updateCharacterButtons();
}

function selectCharacter(character) {
  currentCharacter = character;
  currentVariant = 0;

  selectedCharacterElement.textContent =
    character === " " ? "Leerzeichen" : character;

  loadCurrentVariant();
  updateCharacterButtons();
  updateVariantButtons();
  statusText.textContent = "";
}

function loadCurrentVariant() {
  const variants = getVariants(currentCharacter);

  strokes = variants[currentVariant]
    ? cloneStrokes(variants[currentVariant])
    : [];

  redrawDrawingCanvas();
}

function updateCharacterButtons() {
  [...characterList.children].forEach(button => {
    const character = button.textContent === "␠" ? " " : button.textContent;

    button.classList.toggle("active", character === currentCharacter);
    button.classList.toggle("saved", getVariants(character).length > 0);
  });
}

function updateVariantButtons() {
  const variants = getVariants(currentCharacter);

  firstVariantButton.classList.toggle("active", currentVariant === 0);
  secondVariantButton.classList.toggle("active", currentVariant === 1);
  firstVariantButton.classList.toggle("available", Boolean(variants[0]));
  secondVariantButton.classList.toggle("available", Boolean(variants[1]));

  drawingTitle.textContent =
    currentVariant === 0 ? "Erste Vorlage" : "Zweite Vorlage";
}

function getCanvasPosition(event) {
  const rectangle = drawingCanvas.getBoundingClientRect();

  return {
    x: ((event.clientX - rectangle.left) / rectangle.width) * drawingCanvas.width,
    y: ((event.clientY - rectangle.top) / rectangle.height) * drawingCanvas.height
  };
}

drawingCanvas.addEventListener("pointerdown", event => {
  drawingCanvas.setPointerCapture(event.pointerId);
  currentStroke = [getCanvasPosition(event)];
  strokes.push(currentStroke);
  redrawDrawingCanvas();
});

drawingCanvas.addEventListener("pointermove", event => {
  if (!currentStroke) return;
  currentStroke.push(getCanvasPosition(event));
  redrawDrawingCanvas();
});

drawingCanvas.addEventListener("pointerup", () => { currentStroke = null; });
drawingCanvas.addEventListener("pointercancel", () => { currentStroke = null; });

function drawGuideCharacter() {
  if (currentCharacter === " ") return;

  drawingContext.save();
  drawingContext.fillStyle = "rgba(105, 120, 110, .28)";
  drawingContext.font = `${SOURCE_FONT_SIZE}px Arial`;
  drawingContext.textAlign = "center";
  drawingContext.textBaseline = "alphabetic";
  drawingContext.fillText(currentCharacter, drawingCanvas.width / 2, SOURCE_BASELINE);
  drawingContext.restore();
}

function redrawDrawingCanvas() {
  drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
  drawGuideCharacter();

  drawingContext.strokeStyle = "#17251b";
  drawingContext.lineWidth = 6;
  drawingContext.lineCap = "round";
  drawingContext.lineJoin = "round";

  for (const stroke of strokes) {
    if (stroke.length < 2) continue;

    drawingContext.beginPath();
    drawingContext.moveTo(stroke[0].x, stroke[0].y);

    for (let i = 1; i < stroke.length; i++) {
      drawingContext.lineTo(stroke[i].x, stroke[i].y);
    }

    drawingContext.stroke();
  }
}

firstVariantButton.addEventListener("click", () => {
  currentVariant = 0;
  loadCurrentVariant();
  updateVariantButtons();
});

secondVariantButton.addEventListener("click", () => {
  currentVariant = 1;
  loadCurrentVariant();
  updateVariantButtons();
});

document.getElementById("saveButton").addEventListener("click", () => {
  if (!strokes.length) {
    statusText.textContent = "Bitte zeichne zuerst den Buchstaben.";
    return;
  }

  if (!handwriting[currentCharacter]) {
    handwriting[currentCharacter] = [];
  }

  handwriting[currentCharacter][currentVariant] = cloneStrokes(strokes);

  saveHandwriting();
  updateCharacterButtons();
  updateVariantButtons();

  statusText.textContent =
    currentVariant === 0
      ? "Erste Vorlage gespeichert."
      : "Zweite Vorlage gespeichert.";

  generateWorksheet();
});

document.getElementById("clearButton").addEventListener("click", () => {
  strokes = [];
  redrawDrawingCanvas();
  statusText.textContent = "";
});

function getGlyphBounds(glyph) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  glyph.forEach(stroke => {
    stroke.forEach(point => {
      minX = Math.min(minX, point.x);
      minY = Math.min(minY, point.y);
      maxX = Math.max(maxX, point.x);
      maxY = Math.max(maxY, point.y);
    });
  });

  if (!isFinite(minX)) return null;

  return {
    minX, minY, maxX, maxY,
    width: Math.max(1, maxX - minX),
    height: Math.max(1, maxY - minY)
  };
}

function isSmallNarrowCharacter(character) {
  const base = character.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return base === "i" || base === "j" || base === "l";
}

function chooseGlyph(character) {
  const variants = getVariants(character).filter(Boolean);

  if (!variants.length) return null;

  if (variants.length >= 2) {
    return Math.random() < 0.5 ? variants[0] : variants[1];
  }

  return variants[0];
}

function getGlyphScale(bounds, targetHeight, maximumWidth) {
  return Math.min(targetHeight / SOURCE_FONT_SIZE, maximumWidth / bounds.width);
}

function getGlyphWidth(glyph, targetHeight, maximumWidth) {
  if (!glyph) return 0;

  const bounds = getGlyphBounds(glyph);
  if (!bounds) return 0;

  return bounds.width * getGlyphScale(bounds, targetHeight, maximumWidth);
}

function getCharacterWidth(character, targetHeight, maximumWidth) {
  let width = getGlyphWidth(chooseGlyph(character), targetHeight, maximumWidth);

  if (!width) {
    measureContext.font = `${targetHeight}px Arial`;
    width = measureContext.measureText(character).width;
  }

  if (isSmallNarrowCharacter(character)) {
    width = Math.max(width, NARROW_MIN_ADVANCE);
  }

  return width;
}

function drawGlyph(context, glyph, x, baseline, maximumWidth, targetHeight) {
  if (!glyph) return;

  const bounds = getGlyphBounds(glyph);
  if (!bounds) return;

  const scale = getGlyphScale(bounds, targetHeight, maximumWidth);
  const offsetY = baseline - (SOURCE_BASELINE - bounds.minY) * scale;

  context.save();
  context.strokeStyle = "#17251b";
  context.lineWidth = Math.max(1.4, 5 * scale);
  context.lineCap = "round";
  context.lineJoin = "round";

  glyph.forEach(stroke => {
    if (stroke.length < 2) return;

    context.beginPath();
    context.moveTo(
      x + (stroke[0].x - bounds.minX) * scale,
      offsetY + (stroke[0].y - bounds.minY) * scale
    );

    for (let i = 1; i < stroke.length; i++) {
      context.lineTo(
        x + (stroke[i].x - bounds.minX) * scale,
        offsetY + (stroke[i].y - bounds.minY) * scale
      );
    }

    context.stroke();
  });

  context.restore();
}

function drawHandwrittenCharacter(context, character, x, baseline, maximumWidth, targetHeight) {
  const glyph = chooseGlyph(character);

  if (!glyph) {
    context.save();
    context.fillStyle = "#17251b";
    context.font = `${targetHeight}px Arial`;
    context.textBaseline = "alphabetic";
    context.fillText(character, x, baseline);
    context.restore();
    return;
  }

  drawGlyph(context, glyph, x, baseline, maximumWidth, targetHeight);
}

/* ---------- Seiten ---------- */

function drawPageLines(context, canvas) {
  context.save();
  context.strokeStyle = "#d5e3d9";
  context.lineWidth = .7;

  for (let baseline = FIRST_BASELINE; baseline < canvas.height - 45; baseline += LINE_HEIGHT) {
    context.beginPath();
    context.moveTo(48, baseline);
    context.lineTo(canvas.width - 48, baseline);
    context.stroke();
  }

  context.restore();
}

function newPage() {
  const canvas = document.createElement("canvas");

  canvas.width = PAGE_WIDTH;
  canvas.height = PAGE_HEIGHT;
  canvas.className = "worksheet-page";

  const label = document.createElement("p");
  label.className = "page-label";
  label.textContent = `Seite ${pages.length + 1}`;

  pagesElement.appendChild(label);
  pagesElement.appendChild(canvas);

  ctx = canvas.getContext("2d");
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawPageLines(ctx, canvas);

  pages.push(canvas);

  cx = MARGIN;
  cy = FIRST_BASELINE;
  needPage = false;
}

/* Legt die neue Seite erst an, wenn wirklich etwas darauf geschrieben wird */
function ensurePage() {
  if (needPage && pages.length < MAX_PAGES) {
    newPage();
  }
}

function newLine() {
  cx = MARGIN;
  cy += LINE_HEIGHT;

  if (cy > PAGE_HEIGHT - MARGIN) {
    needPage = true;
  }
}

function getCharacterData(character) {
  const narrow = isSmallNarrowCharacter(character);

  return {
    width: getCharacterWidth(character, TARGET_HEIGHT, MAX_WIDTH),
    leftGap: narrow ? NARROW_LEFT_GAP : 0,
    rightGap: narrow ? NARROW_RIGHT_GAP : LETTER_GAP
  };
}

function getWordWidth(word) {
  let width = 0;

  for (const character of word) {
    const data = getCharacterData(character);
    width += data.leftGap + data.width + data.rightGap;
  }

  return width;
}

function drawOneCharacter(character) {
  ensurePage();
  if (needPage) return;

  const data = getCharacterData(character);

  cx += data.leftGap;
  drawHandwrittenCharacter(ctx, character, cx, cy, MAX_WIDTH, TARGET_HEIGHT);
  cx += data.width + data.rightGap;
}

function drawHyphen() {
  ensurePage();
  if (needPage) return;

  const data = getCharacterData("-");

  drawHandwrittenCharacter(ctx, "-", cx, cy, MAX_WIDTH, TARGET_HEIGHT);
  cx += data.width + data.rightGap;
}

function drawLongWord(word) {
  let index = 0;

  const hyphenWidth =
    getCharacterWidth("-", TARGET_HEIGHT, MAX_WIDTH) + LETTER_GAP;

  while (index < word.length) {
    let currentWidth = 0;
    let lastFittingIndex = index;

    for (let i = index; i < word.length; i++) {
      const data = getCharacterData(word[i]);
      const isLastCharacter = i === word.length - 1;

      const testWidth =
        currentWidth + data.leftGap + data.width + data.rightGap;

      if (
        !isLastCharacter &&
        cx + testWidth + hyphenWidth > PAGE_WIDTH - MARGIN
      ) break;

      if (
        isLastCharacter &&
        cx + testWidth > PAGE_WIDTH - MARGIN
      ) break;

      currentWidth = testWidth;
      lastFittingIndex = i + 1;
    }

    if (lastFittingIndex === index) {
      lastFittingIndex = index + 1;
    }

    for (const character of word.slice(index, lastFittingIndex)) {
      drawOneCharacter(character);
    }

    index = lastFittingIndex;

    if (index < word.length) {
      drawHyphen();
      newLine();
    }
  }
}

function generateWorksheet() {
  const text = document.getElementById("textInput").value;

  pagesElement.innerHTML = "";
  pages = [];
  newPage();

  for (const line of text.split("\n")) {
    if (needPage && pages.length >= MAX_PAGES) break;

    if (line.trim() === "") {
      newLine();
      continue;
    }

    const parts = line.match(/\S+|\s+/g) || [];

    for (const part of parts) {
      if (/^\s+$/.test(part)) {
        cx += SPACE_WIDTH * part.length;
        continue;
      }

      const wordWidth = getWordWidth(part);

      /* Wort passt nicht mehr in die Zeile -> nächste Zeile (ggf. nächste Seite) */
      if (cx > MARGIN && cx + wordWidth > PAGE_WIDTH - MARGIN) {
        newLine();
      }

      if (wordWidth > PAGE_WIDTH - MARGIN * 2) {
        drawLongWord(part);
      } else {
        for (const character of part) {
          drawOneCharacter(character);
        }
      }
    }

    newLine();
  }

  pageInfo.textContent =
    pages.length === 1
      ? "Das Arbeitsblatt hat 1 Seite."
      : `Das Arbeitsblatt hat ${pages.length} Seiten.`;

  if (pages.length >= MAX_PAGES && needPage) {
    pageInfo.textContent += ` (Maximum von ${MAX_PAGES} Seiten erreicht.)`;
  }
}

/* ---------- Download ---------- */

/* Erkennt iPads und iPhones. Neuere iPads geben sich als Macintosh aus. */
function isAppleMobileDevice() {
  return (
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
  );
}

function pageFileName(index) {
  return pages.length === 1
    ? "mein-handgeschriebenes-arbeitsblatt.png"
    : `mein-handgeschriebenes-arbeitsblatt-seite-${index + 1}.png`;
}

function downloadPageBlob(canvas, index) {
  canvas.toBlob(blob => {
    let url;
    let revoke = false;

    if (blob) {
      url = URL.createObjectURL(blob);
      revoke = true;
    } else {
      url = canvas.toDataURL("image/png");
    }

    const link = document.createElement("a");
    link.href = url;
    link.download = pageFileName(index);

    document.body.appendChild(link);
    link.click();
    link.remove();

    if (revoke) {
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  }, "image/png");
}

/*
  Auf Windows/Mac: jede Seite wird als eigene PNG-Datei heruntergeladen.
  Auf iPad/iPhone: alle Seiten werden untereinander in einem neuen Tab
  geöffnet (das Fenster wird synchron beim Klick geöffnet, damit Safari
  es nicht als Popup blockiert).
*/
function downloadWorksheetAsPNG() {
  if (!pages.length) return;

  if (isAppleMobileDevice()) {
    const appleWindow = window.open("", "_blank");

    const images = pages
      .map((canvas, i) =>
        `<p style="font:13px Arial;color:#718078;margin:14px 0 4px">Seite ${i + 1} von ${pages.length}</p>` +
        `<img src="${canvas.toDataURL("image/png")}" style="width:100%;max-width:794px;display:block;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.25)">`
      )
      .join("");

    if (appleWindow) {
      appleWindow.document.title = "Arbeitsblatt PNG";
      appleWindow.document.body.style.cssText =
        "margin:0;padding:14px;text-align:center;font-family:Arial,sans-serif;background:#eaf7ee";
      appleWindow.document.body.innerHTML =
        `<p style="font-size:15px">Halte jedes Bild gedrückt und wähle „In Fotos sichern“ oder „In Dateien sichern“.</p>${images}`;

      downloadInfo.textContent =
        "Halte die Bilder im neuen Tab gedrückt, um sie zu speichern.";
    } else {
      /* Fallback, falls Safari das neue Fenster blockiert */
      window.location.href = pages[0].toDataURL("image/png");
      downloadInfo.textContent =
        "Halte das Bild gedrückt, um es zu speichern.";
    }

    return;
  }

  pages.forEach((canvas, index) => {
    setTimeout(() => downloadPageBlob(canvas, index), index * 400);
  });

  downloadInfo.textContent =
    pages.length > 1
      ? `${pages.length} Seiten werden als einzelne PNG-Dateien heruntergeladen.`
      : "";
}

document.getElementById("generateButton").addEventListener("click", generateWorksheet);

document.getElementById("downloadButton").addEventListener("click", () => {
  const button = document.getElementById("downloadButton");

  if (button.disabled) return;

  button.disabled = true;
  downloadWorksheetAsPNG();

  setTimeout(() => { button.disabled = false; }, 1500 + pages.length * 400);
});

createCharacterButtons();
selectCharacter("A");
generateWorksheet();
</script>

</body>
</html>
